# Render blueprint.
#
# Deliberately minimal. An earlier version specified region, autoDeployTrigger and a
# paid plan, and the blueprint sync failed with no events recorded — nothing was
# created, so there was nothing to inspect. Everything omitted here has a sensible
# Render default that can be changed in the dashboard afterwards, so the file only
# states what actually matters: it is a Docker service, on the free instance, with a
# health check that does not touch the database.
#
# Secrets use `sync: false`, so Render prompts for each one and none are stored here.
services:
  - type: web
    name: tabeeb
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: S3_REGION
        value: auto

      # Render exposes these to the Docker build as build arguments, which is what
      # makes the Clerk publishable key work: Next inlines NEXT_PUBLIC_* into the
      # client bundle at build time, so a value supplied only at runtime produces an
      # image that builds cleanly and then fails every request.
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      - key: CLERK_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false

      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false

      - key: HF_API_KEY
        sync: false
